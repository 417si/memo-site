<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
    <meta name="description" content="シンプルで美しい、ブラウザで使えるメモ。自動保存、検索、ダークモード対応。">
    <title>メモ</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app" id="app" data-view="list">

    <!-- サイドバー：メモ一覧 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-inner">
            <header class="sidebar-header">
                <h1 class="brand">メモ</h1>
                <button class="icon-btn accent" id="new-btn" type="button" aria-label="新規メモ" title="新規メモ (Option + N)">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                </button>
            </header>

            <label class="search">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input id="search" type="search" placeholder="検索" autocomplete="off" aria-label="メモを検索">
                <kbd id="search-kbd">⌘K</kbd>
            </label>

            <nav class="list" id="list" aria-label="メモ一覧"></nav>

            <footer class="sidebar-footer" id="count"></footer>
        </div>
    </aside>

    <!-- メイン：エディタ -->
    <main class="main">
        <div class="toolbar">
            <button class="icon-btn" id="nav-btn" type="button" aria-label="サイドバーを開閉" title="サイドバーを開閉">
                <svg class="ico-sidebar" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
                <svg class="ico-back" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
            </button>
            <span class="spacer"></span>
            <button class="icon-btn" id="pin-btn" type="button" aria-label="ピン留め" aria-pressed="false" title="ピン留め" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l-1 6 3 3v2H7v-2l3-3-1-6Z"/><path d="M12 15v5"/></svg>
            </button>
            <button class="icon-btn danger" id="delete-btn" type="button" aria-label="削除" title="削除" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
            </button>
        </div>

        <div class="scroll" id="scroll">
            <article class="editor" id="editor" hidden>
                <div class="head">
                    <textarea id="title" rows="1" placeholder="タイトル" aria-label="タイトル" spellcheck="false"></textarea>
                    <div class="meta" id="meta"></div>
                </div>
                <textarea id="body" placeholder="ここに書き始めましょう…" aria-label="本文"></textarea>
            </article>

            <section class="empty" id="empty">
                <div class="empty-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"/><path d="M14 4v5h5M8.5 13h7M8.5 16.5h5"/></svg>
                </div>
                <h2>メモを書き始めましょう</h2>
                <p>入力した内容は自動で保存されます。</p>
                <button class="btn" id="empty-new" type="button">新規メモ</button>
            </section>
        </div>
    </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toast-text"></span>
    <button type="button" id="toast-undo">元に戻す</button>
</div>

<script src="script.js"></script>
</body>
</html>
